<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Defesa de Torres</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="game-over" class="escondido">
    <h1>Game Over</h1>
      <p id="pontuacao-final"></p>
      <button id="botao-reiniciar">Reiniciar</button>
    </div>
    <div id="hud">
      <div id="hud-vida">Vida: <span id="valor-vida">100</span></div>
      <div id="hud-pontuacao">Pontos: <span id="valor-pontuacao">0</span></div>
    </div>
    <div id="hud-desbloqueios">
      <div id="status-catapulta">🏹 Catapulta: 100 pts</div>
      <div id="status-anubis">🐺 Anúbis: 400 pts</div>
      <div id="status-dificuldade">⚠️ Dificuldade+: 800 pts</div>
    </div>

    <div id="controles">
      <button id="botao-pause">⏸ Pausar</button>
      <button id="botao-fullscreen">⛶ Tela cheia</button>
    </div>

    <div id="tela-pause" class="escondido">
      <h1>Pausado</h1>
      <button id="botao-continuar">Continuar</button>
    </div>
  
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
